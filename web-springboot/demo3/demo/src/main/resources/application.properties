# 应用配置
spring.application.name=campus-violence-detection
server.port=8080
server.servlet.context-path=/api

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/campus_violence?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=orangepi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# JWT配置
jwt.secret=campus-violence-detection-secret-key-2024
jwt.expiration=86400000

# 文件上传配置
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# 传感器服务器配置
sensor.server.host=localhost
sensor.server.port=8088

# 声音分析服务器配置
sound.server.host=localhost
sound.server.port=8089

# RKNN 推理服务器配置
rknn.server.host=localhost
rknn.server.port=8091

# 日志配置
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
