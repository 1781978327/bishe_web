# Sound_Monitoring realtime audio defaults
# This file is loaded by rknn_yamnet_demo_http at startup.

realtime:
  device: "parec:alsa_input.usb-Jieli_Technology_UACDemoV1.0_4150344C3631350D-00.mono-fallback"
  fallback_device: "parec:alsa_input.usb-Web_Camera_Web_Camera_202409021440-02.mono-fallback.2"
  auto_start: true
  print_asr: true
  print_window: true
  capture_volume: 1.0

  pulse:
    set_default_source: true
    source_volume: "100%"

  mixer:
    enabled: true
    card: "auto"
    control: "Mic"
    volume: "100%"
    auto_gain_control: "off"

  filter:
    ffmpeg:
      enabled: false
      bin: "ffmpeg"
      audio_filter: "afftdn=nf=-40,highpass=f=100,lowpass=f=3500,volume=6.0"
    sox:
      enabled: false
      bin: "sox"
      profile: ""
      amount: 0.25
